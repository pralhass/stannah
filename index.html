<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creatomate Ads</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,
  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="%23b30000"/>
        <stop offset="100%" stop-color="%23ff1a1a"/>
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="56" height="56" rx="8" ry="8" fill="none" stroke="url(%23g)" stroke-width="4"/>
    <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="36" fill="url(%23g)">S</text>
  </svg>' />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --muted: #64748b;
      --text: #0f172a;
      --primary: #4f46e5;
      --primary-600: #4338ca;
      --ring: #22d3ee;
      --success: #16a34a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #e5e7eb;
    }
    .theme-dark {
      --bg: #0b1020;
      --card: #11172b;
      --muted: #94a3b8;
      --text: #e6edf6;
      --border: #23304c;
    }
    .theme-light {
      --bg: #f7f8fb;
      --card: #ffffff;
      --muted: #64748b;
      --text: #0f172a;
      --border: #e5e7eb;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 1200px at 20% -10%, var(--card) 0%, var(--bg) 55%) fixed;
      color: var(--text);
      transition: background .2s ease, color .2s ease;
    }

    .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .title{display:flex;align-items:center;gap:14px}

    .logo{width:44px;height:44px;border-radius:8px;border:2px solid #b30000;display:grid;place-items:center;background:transparent}
    .logo span{font-weight:800;color:#b30000;font-size:22px;font-family:Arial, sans-serif;line-height:1}

    h1{margin:0;font-size:22px;letter-spacing:.2px}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:14px}

    .theme-switch{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:0 8px 20px rgba(2,6,23,.15)}
    .theme-switch .seg{background:transparent;color:var(--text);border:none;border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;transition:background .15s ease, transform .05s ease}
    .theme-switch .seg:hover{transform:translateY(-1px)}
    .theme-switch .seg.active,[aria-pressed="true"]{background:rgba(79,70,229,.14)}
    .theme-light .theme-switch .seg.active,.theme-light [aria-pressed="true"]{background:rgba(79,70,229,.12)}

    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
    @media (max-width:960px){.grid{grid-template-columns:1fr}}

    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(2,6,23,.45), inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(6px)}

    .form-row{display:grid;gap:12px;margin-bottom:16px}
    label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
    .hint{font-size:12px;color:var(--muted)}

    select,input[type="text"],textarea,button{width:100%;padding:12px 14px;font-size:15px;border-radius:12px;border:1px solid var(--border);background:#0e1530;color:var(--text);outline:none;transition:border-color .15s ease, box-shadow .15s ease, transform .02s ease}
    .theme-light select,.theme-light input[type="text"],.theme-light textarea,.theme-light button{background:#ffffff}
    select:focus,input[type="text"]:focus,textarea:focus{border-color:var(--ring);box-shadow:0 0 0 4px rgba(34,211,238,.15)}
    textarea{resize:vertical;min-height:72px}

    .actions{display:flex;gap:10px;align-items:center;margin-top:8px}

    .btn-primary{background:linear-gradient(180deg,var(--primary),var(--primary-600));border:none;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(79,70,229,.35)}
    .btn-primary:hover{transform:translateY(-1px)}
    .btn-secondary{background:#0e1530;border:1px solid var(--border)}
    .theme-light .btn-secondary{background:#fff}

    .media{display:grid;gap:12px}
    .preview{border:1px dashed var(--border);border-radius:16px;overflow:hidden;position:relative;background:#0a0f22}
    .theme-light .preview{background:#f9fafb}
    .preview .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px dashed var(--border);color:var(--muted);font-size:12px}
    .preview img{width:100%;display:block}

    .image-stage{position:relative;display:grid;place-items:center}
    #image{max-width:100%;display:none;border-radius:0 0 16px 16px}
    #focusMarker{position:absolute;width:54px;height:54px;border-radius:999px;backdrop-filter:blur(1px);box-shadow:0 0 0 3px rgba(34,211,238,.8),0 0 0 10px rgba(34,211,238,.08);pointer-events:none;display:none;z-index:10;animation:pulse 1.2s infinite ease-in-out}
    @keyframes pulse{0%{transform:scale(.96);box-shadow:0 0 0 3px rgba(34,211,238,.9),0 0 0 8px rgba(34,211,238,.08)}70%{transform:scale(1);box-shadow:0 0 0 3px rgba(34,211,238,.9),0 0 0 16px rgba(34,211,238,.04)}100%{transform:scale(.96);box-shadow:0 0 0 3px rgba(34,211,238,.9),0 0 0 8px rgba(34,211,238,.08)}}

    .toast{position:fixed;right:18px;bottom:18px;z-index:9999;display:none;align-items:center;gap:12px;background:#0e1530;border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:14px;box-shadow:0 10px 30px rgba(2,6,23,.4);min-width:280px}
    .theme-light .toast{background:#ffffff}
    .toast.show{display:flex}
    .toast .dot{width:10px;height:10px;border-radius:999px;background:var(--success);box-shadow:0 0 12px var(--success)}
    .small{font-size:12px;color:var(--muted)}

    .recent-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .pill{border:1px solid var(--border);border-radius:9999px;padding:6px 10px;font-size:12px;cursor:pointer;background:transparent}
    .pill:hover{transform:translateY(-1px)}

    .inline-actions{display:flex;gap:8px}
    .inline-actions button{width:auto}
  </style>
</head>
<body class="theme-dark">
  <div class="wrap">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true"><span>S</span></div>
        <div>
          <h1>Creatomate Ads</h1>
          <p class="subtitle">Cria e personaliza criativos publicitários dinamicamente por template.</p>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="Tema">
        <button id="themeLight" class="seg" aria-pressed="false" title="Tema claro" type="button">☀️ Claro</button>
        <button id="themeDark" class="seg" aria-pressed="true" title="Tema escuro" type="button">🌙 Escuro</button>
      </div>
    </header>

    <div class="grid">
      <section class="card" aria-label="Formulário de criação">
        <div class="form-row">
          <label for="template">Template</label>
          <select id="template" required>
            <option value="">A carregar templates…</option>
          </select>
          <div class="small">A pré-visualização atualiza automaticamente. Os campos abaixo são gerados a partir do template.</div>
        </div>

        <!-- Host do formulário dinâmico -->
        <div id="dynamicForm"></div>

        <div class="actions">
          <button class="btn-secondary" id="loadImageBtn" type="button" aria-label="Carregar imagem">Carregar imagem</button>
          <button class="btn-primary" id="submitButton" type="button" aria-label="Enviar dados">Enviar</button>
        </div>
      </section>

      <section class="media" aria-label="Pré-visualizações">
        <div class="preview card">
          <div class="head">Pré-visualização do template <span class="small">(auto)</span></div>
          <img id="previewTemplate" alt="Pré-visualização do template" style="display:none;" loading="lazy" />
        </div>

        <div class="preview card">
          <div class="head">Imagem & ponto focal <span class="small">(clica para definir)</span></div>
          <div class="image-stage" id="imageContainer">
            <img id="image" alt="Imagem carregada" loading="lazy" />
            <div id="focusMarker" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="dot" aria-hidden="true"></div>
    <div>
      <div id="toastTitle" style="font-weight:700;">Sucesso</div>
      <div id="toastMsg" class="small">Dados enviados.</div>
    </div>
  </div>

  <script>
    /* =========================
       CONFIGURAÇÃO EXTERNA
       ========================= */
    // 1) GitHub RAW (recomendado). Substitui pelos teus dados REAIS:
    const GITHUB_TPL_URL = "https://raw.githubusercontent.com/pralhass/stannah/main/templates.json";

    // 2) Fallback Google Drive (opcional): coloca o fileId de um templates.json público
    const DRIVE_FILE_ID = "https://drive.google.com/file/d/1KFX4UCPWOv71ydHjaenPTXn8HSSfIMlx/view?usp=sharing"; // ex.: "1AbC..."
    const SHOW_RECENTS = false; // histórico local de links (off)

    /* =========================
       THEME
       ========================= */
    (function(){
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const saved = localStorage.getItem('ui-theme');
      const initial = saved || (prefersDark ? 'theme-dark' : 'theme-light');

      function applyTheme(theme){
        document.body.classList.remove('theme-dark','theme-light');
        document.body.classList.add(theme);
        localStorage.setItem('ui-theme', theme);
        const isDark = theme === 'theme-dark';
        const btnLight = document.getElementById('themeLight');
        const btnDark  = document.getElementById('themeDark');
        if(btnLight&&btnDark){
          btnLight.classList.toggle('active', !isDark);
          btnDark.classList.toggle('active',  isDark);
          btnLight.setAttribute('aria-pressed', String(!isDark));
          btnDark.setAttribute('aria-pressed',  String(isDark));
        }
      }
      window.addEventListener('DOMContentLoaded', () => {
        applyTheme(initial);
        document.getElementById('themeLight')?.addEventListener('click', () => applyTheme('theme-light'));
        document.getElementById('themeDark')?.addEventListener('click',  () => applyTheme('theme-dark'));
      });
    })();

    /* =========================
       TOAST + UTILS
       ========================= */
    function showToast(title,msg,isError=false){
      const toast = document.getElementById('toast');
      const dot = toast.querySelector('.dot');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMsg').textContent = msg;
      dot.style.background = isError ? 'var(--danger)' : 'var(--success)';
      dot.style.boxShadow = isError ? '0 0 12px var(--danger)' : '0 0 12px var(--success)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3800);
    }

    function parseDriveUrl(url){
      let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)\//);
      if (m && m[1]) return {id:m[1], type:'file'};
      m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m && m[1]) return {id:m[1], type:'file'};
      m = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (m && m[1]) return {id:m[1], type:'folder'};
      return null;
    }
    function driveThumbnailUrl(id, width=1600){ return \`https://drive.google.com/thumbnail?id=\${id}&sz=w\${width}\`; }
    function convertGoogleDriveUrl(url){ const p = parseDriveUrl(url); return (p && p.type==='file') ? driveThumbnailUrl(p.id) : url; }
    function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16); }); }

    /* =========================
       LOADER DE TEMPLATES
       ========================= */
    async function loadFromGitHub(){
      if (!GITHUB_TPL_URL || GITHUB_TPL_URL.includes("<repo>")) throw new Error("URL GitHub não configurado");
      const res = await fetch(GITHUB_TPL_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Falha GitHub");
      const json = await res.json();
      if (!json || !json.templates) throw new Error("Formato inválido em templates.json");
      return json.templates;
    }
    async function loadFromDrive(){
      if (!DRIVE_FILE_ID) throw new Error("Drive FILE_ID vazio");
      const url = \`https://drive.google.com/uc?export=download&id=\${DRIVE_FILE_ID}\`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("Falha Drive");
      const json = await res.json();
      if (!json || !json.templates) throw new Error("Formato inválido em templates.json (Drive)");
      return json.templates;
    }
    async function loadTemplates(){
      try { return await loadFromGitHub(); }
      catch(e1){
        console.warn("GitHub falhou:", e1.message);
        try { return await loadFromDrive(); }
        catch(e2){
          console.error("Drive falhou:", e2.message);
          showToast("Erro", "Não foi possível carregar templates.json", true);
          return {};
        }
      }
    }

    /* =========================
       UI DINÂMICA
       ========================= */
    const templateSelect = document.getElementById('template');
    const previewImg = document.getElementById('previewTemplate');
    const formHost = document.getElementById('dynamicForm');

    function mountTemplateSelect(selectEl, registry){
      selectEl.innerHTML = '<option value="">Seleciona um template…</option>';
      Object.entries(registry).forEach(([key, tpl]) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = tpl.label || key;
        selectEl.appendChild(opt);
      });
    }

    function createFieldControl(field){
      const row = document.createElement('div');
      row.className = 'form-row';
      row.dataset.fieldId = field.id;

      const label = document.createElement('label');
      label.htmlFor = field.id;
      label.textContent = field.label || field.id;
      row.appendChild(label);

      let input;
      switch(field.type){
        case 'textarea': input = document.createElement('textarea'); input.rows = 3; break;
        case 'select':
          input = document.createElement('select');
          (field.options || []).forEach(opt => {
            const o = document.createElement('option'); o.value = opt.value; o.textContent = opt.label; input.appendChild(o);
          });
          break;
        case 'switch':
          input = document.createElement('input'); input.type = 'checkbox'; break;
        default:
          input = document.createElement('input'); input.type = field.type || 'text';
      }
      input.id = field.id; input.name = field.id;
      if (field.placeholder) input.placeholder = field.placeholder;
      if (field.required) input.required = true;
      if (field.maxLength && input.tagName !== 'SELECT' && input.type !== 'checkbox') input.maxLength = field.maxLength;

      row.appendChild(input);

      if (field.help || field.maxLength){
        const meta = document.createElement('div');
        meta.className = 'counter';
        meta.innerHTML = \`<span>\${field.help || ''}</span><strong>\${field.maxLength ? \`0/\${field.maxLength}\` : ''}</strong>\`;
        row.appendChild(meta);
        if (field.maxLength){
          input.addEventListener('input', () => {
            meta.querySelector('strong').textContent = \`\${(input.value || '').length}/\${field.maxLength}\`;
          });
        }
      }

      const err = document.createElement('div');
      err.className = 'error-msg'; err.style.display = 'none';
      err.textContent = 'Campo inválido ou obrigatório.';
      row.appendChild(err);

      row.dataset.visibleIf = field.visibleIf ? JSON.stringify(field.visibleIf) : '';

      return row;
    }

    function applyVisibility(container){
      const values = Object.fromEntries([...container.querySelectorAll('[name]')].map(el => [el.name, (el.type === 'checkbox') ? el.checked : el.value]));
      [...container.querySelectorAll('.form-row[data-visible-if]')].forEach(row => {
        const cfg = row.dataset.visibleIf ? JSON.parse(row.dataset.visibleIf) : null;
        if (!cfg) return row.style.removeProperty('display');
        const cur = values[cfg.field];
        const visible = ('equals' in cfg) ? cur == cfg.equals : true;
        row.style.display = visible ? '' : 'none';
      });
    }

    function mountDynamicFormFor(registry, templateKey){
      formHost.innerHTML = '';
      if (!templateKey){ previewImg.style.display = 'none'; return; }
      const tpl = registry[templateKey]; if (!tpl) return;
      if (tpl.previewUrl){ previewImg.src = convertGoogleDriveUrl(tpl.previewUrl); previewImg.style.display = 'block'; }

      tpl.fields.forEach(f => formHost.appendChild(createFieldControl(f)));
      formHost.addEventListener('input', () => applyVisibility(formHost), { once: true });
      applyVisibility(formHost);
    }

    function validateAndBuildPayload(registry, templateKey){
      const tpl = registry[templateKey]; if (!tpl) return { ok:false, errors:['Template inválido'] };
      const errors = []; const data = {};
      tpl.fields.forEach(f => {
        const el = formHost.querySelector(\`[name="\${f.id}"]\`);
        if (!el) return;
        const row = el.closest('.form-row');
        if (row && row.style.display === 'none') return; // ignorar escondidos
        const val = (el.type === 'checkbox') ? el.checked : (el.value || '').trim();

        if (f.required && (val === '' || val === false)){
          errors.push(f.label || f.id);
          el.classList.add('error'); row?.querySelector('.error-msg')?.style.setProperty('display','block');
        } else { el.classList.remove('error'); row?.querySelector('.error-msg')?.style.removeProperty('display'); }

        if (f.maxLength && typeof val === 'string' && val.length > f.maxLength){
          errors.push(\`\${f.label || f.id} excede \${f.maxLength}\`);
          el.classList.add('error'); row?.querySelector('.error-msg')?.style.setProperty('display','block');
        }
        data[f.id] = val;
      });
      if (errors.length) return { ok:false, errors };

      const mapped = {}; const map = tpl.submitMap || {};
      Object.keys(data).forEach(k => { mapped[map[k] || k] = data[k]; });
      return { ok:true, payload: mapped };
    }

    /* =========================
       IMAGEM & PONTO FOCAL
       ========================= */
    const img = document.getElementById('image');
    const marker = document.getElementById('focusMarker');
    const loadBtn = document.getElementById('loadImageBtn');
    let focusX = null, focusY = null;

    function getImageUrlValue(){
      // convenciona: campo id = "image_url"
      const el = formHost.querySelector('#image_url');
      return el ? (el.value || '').trim() : '';
    }

    function loadImage(){
      const rawUrl = getImageUrlValue();
      if (!rawUrl){ showToast('Imagem', 'Preenche o campo "URL da Imagem" no formulário.', true); return; }
      const url = convertGoogleDriveUrl(rawUrl);
      img.src = url; img.style.display = 'block'; marker.style.display = 'none';
      focusX = null; focusY = null;
    }
    loadBtn.addEventListener('click', loadImage);
    img.onerror = () => { showToast('Erro ao carregar imagem', 'Verifica o link ou permissões no Drive.', true); };
    img.addEventListener('click', function(e){
      const rectImg  = img.getBoundingClientRect();
      const rectWrap = document.getElementById('imageContainer').getBoundingClientRect();
      const clickX = e.clientX - rectImg.left;
      const clickY = e.clientY - rectImg.top;
      focusX = Math.round((clickX / rectImg.width) * 100);
      focusY = Math.round((clickY / rectImg.height) * 100);
      const offsetX = (rectImg.left - rectWrap.left) + clickX - 27;
      const offsetY = (rectImg.top  - rectWrap.top)  + clickY - 27;
      marker.style.left = \`\${offsetX}px\`; marker.style.top = \`\${offsetY}px\`; marker.style.display = 'block';
    });

    /* =========================
       SUBMISSÃO
       ========================= */
    const SUBMIT_WEBHOOK = "https://hook.eu2.make.com/ud2ltvos440cz2b6kw82dykit54gxurv";
    document.getElementById('submitButton').addEventListener('click', async () => {
      const t = templateSelect.value;
      const res = validateAndBuildPayload(window.__TEMPLATE_REGISTRY__, t);
      if (!res.ok){ showToast('Faltam campos', \`Por favor corrige: \${res.errors.join(', ')}\`, true); return; }
      const finalPayload = { idOperacao: uuid(), template: t, ...res.payload };
      if (focusX !== null && focusY !== null){ finalPayload.focus_x = focusX; finalPayload.focus_y = focusY; }

      try{
        await fetch(SUBMIT_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(finalPayload) });
        showToast('Enviado', 'Dados enviados com sucesso!');
      }catch(e){
        showToast('Falhou envio', 'Tenta novamente em instantes.', true);
      }
    });

    /* =========================
       BOOTSTRAP
       ========================= */
    window.addEventListener('DOMContentLoaded', async () => {
      const registry = await loadTemplates();
      window.__TEMPLATE_REGISTRY__ = registry;
      mountTemplateSelect(templateSelect, registry);
      templateSelect.addEventListener('change', () => mountDynamicFormFor(registry, templateSelect.value));
    });
  </script>
</body>
</html>
